# Nginx — AccreditEvent self-hosted (air-gapped, LAN)
# Sincronizado con la configuración que genera install.sh.
# Sirve el build estático del frontend React por HTTPS (self-signed) y hace
# reverse proxy de /api y /ws al backend Node (puerto 4000).
# La cámara (getUserMedia) requiere origin seguro → HTTPS forzado con redirect.

# HTTP → HTTPS (redirección forzada)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /opt/accreditevent/ssl/ae-self.crt;
    ssl_certificate_key /opt/accreditevent/ssl/ae-self.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/accreditevent/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
    }

    # WebSocket (realtime)
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Uploads locales (si se sirve directo por nginx en lugar de Node)
    location /uploads/ {
        alias /opt/accreditevent/server/uploads/;
    }

    # Modelos de face-api.js (pesos servidos localmente, sin internet)
    location /models/ {
        alias /opt/accreditevent/server/public/models/;
    }
}