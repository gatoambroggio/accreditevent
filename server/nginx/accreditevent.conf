# Nginx — AccreditEvent self-hosted (air-gapped, LAN)
# Sirve el build estático del frontend React desde el mismo servidor y
# hace reverse proxy de /api y /ws al backend Node (puerto 4000).

server {
    listen 80;
    server_name _;

    # Frontend (build estático de Vite). Carpeta "frontend/dist".
    root /opt/accreditevent/frontend/dist;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (realtime)
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Uploads locales (si se sirve directo por nginx en lugar de Node)
    location /uploads/ {
        alias /opt/accreditevent/server/uploads/;
    }

    # Modelos de face-api.js (pesos servidos localmente, sin internet)
    location /models/ {
        alias /opt/accreditevent/server/public/models/;
    }

    client_max_body_size 16m;
}